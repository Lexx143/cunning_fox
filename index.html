<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Детективная братва</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="header">
        <div class="header-row">
            <h1 class="game-title"><span class="title-icon" id="title-icon"></span>Детективная братва</h1>
            <div class="fox-danger level-safe" id="fox-danger" title="Сколько шагов лису осталось до норы">
                <span class="fox-danger-icon" id="fox-danger-icon"></span>
                <span>До норы: <b id="danger-count">16</b></span>
            </div>
            <button id="new-game-btn" class="btn btn-primary">Новое дело</button>
        </div>
        <div class="clue-chips" id="clue-chips"></div>
    </header>

    <main class="game-table" id="game-table">
        <div class="suspect-edge edge-top" id="edge-top"></div>
        <div class="suspect-edge edge-left" id="edge-left"></div>
        <div class="board-wrap" id="board-wrap">
            <div class="board-grid" id="board-grid"></div>
            <div class="pawn-layer" id="pawn-layer"></div>
        </div>
        <div class="suspect-edge edge-right" id="edge-right"></div>
        <div class="suspect-edge edge-bottom" id="edge-bottom"></div>
    </main>

    <footer class="action-bar">
        <div class="players-strip" id="players-strip"></div>
        <div class="status" id="status-text"></div>
        <div class="action-buttons">
            <span class="steps-badge hidden" id="steps-badge"><span class="steps-icon" id="steps-icon"></span><b id="steps-left">0</b></span>
            <button id="roll-open-btn" class="btn btn-primary hidden">Бросить кубики</button>
            <button id="check-clue-btn" class="btn btn-accent hidden">Проверить улику</button>
            <button id="end-turn-btn" class="btn btn-secondary hidden">Завершить ход</button>
        </div>
    </footer>

    <div class="modal-overlay hidden" id="modal-overlay">

        <div class="modal hidden" id="modal-setup" data-dismiss="false">
            <h2><span class="modal-icon" id="setup-modal-icon"></span>Новое дело</h2>
            <p class="modal-sub">Лис-воришка стащил пирог! Кто ведёт расследование?</p>
            <div class="count-picker" id="player-count-picker">
                <button type="button" data-count="1">1</button>
                <button type="button" data-count="2">2</button>
                <button type="button" data-count="3">3</button>
                <button type="button" data-count="4">4</button>
            </div>
            <div class="player-names" id="player-names"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary hidden" id="setup-cancel-btn">Отмена</button>
                <button class="btn btn-primary" id="start-game-btn">Начать расследование</button>
            </div>
        </div>

        <div class="modal hidden" id="modal-dice" data-dismiss="false">
            <h2><span class="modal-icon" id="dice-modal-icon"></span>Бросок кубиков</h2>
            <div class="target-picker" id="target-picker">
                <button type="button" class="target-btn" data-target="eyes">
                    <span class="target-icon" id="target-eye-icon"></span>
                    <span class="target-name">Глаза</span>
                    <small>открыть 2 карты</small>
                </button>
                <button type="button" class="target-btn" data-target="clues">
                    <span class="target-icon" id="target-paw-icon"></span>
                    <span class="target-name">Следы</span>
                    <small>ходить по полю</small>
                </button>
            </div>
            <div class="dice-row">
                <div class="die" id="die-0"><span class="die-q">?</span></div>
                <div class="die" id="die-1"><span class="die-q">?</span></div>
                <div class="die" id="die-2"><span class="die-q">?</span></div>
            </div>
            <p class="dice-hint" id="dice-hint"></p>
            <div class="modal-actions dice-actions">
                <span class="rolls-left">Броски: <b id="rolls-left">3</b></span>
                <button class="btn btn-primary" id="roll-btn">Бросить!</button>
            </div>
        </div>

        <div class="modal hidden" id="modal-decoder" data-dismiss="true">
            <h2><span class="modal-icon" id="decoder-modal-icon"></span>Дешифратор улик</h2>
            <p class="modal-sub" id="decoder-sub">Выберите примету для проверки:</p>
            <div class="clue-grid" id="decoder-clues"></div>
            <p class="decoder-result" id="decoder-result"></p>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="decoder-close-btn">Закрыть</button>
            </div>
        </div>

        <div class="modal hidden" id="modal-dossier" data-dismiss="true">
            <div id="dossier-content"></div>
            <div class="modal-actions dossier-actions" id="dossier-actions"></div>
        </div>

        <div class="modal hidden" id="modal-confirm" data-dismiss="false">
            <h2 id="confirm-title"></h2>
            <p class="modal-sub" id="confirm-text"></p>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="confirm-no-btn">Отмена</button>
                <button class="btn btn-danger" id="confirm-yes-btn">Да</button>
            </div>
        </div>

        <div class="modal hidden" id="modal-endgame" data-dismiss="false">
            <div id="endgame-content"></div>
            <div class="modal-actions">
                <button class="btn btn-primary" id="endgame-new-btn">Новое дело</button>
            </div>
        </div>

    </div>

    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
</body>

</html>
